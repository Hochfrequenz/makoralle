[project]
name = "makoralle"
description = "Pydantic models for the German MaKo (Marktkommunikation) processes and serialization of those models to output formats (YAML, WSD sequence-diagram DSL, BPMN, Markdown)."
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Hochfrequenz Unternehmensberatung GmbH", email = "info@hochfrequenz.de" }]
keywords = ["mako", "marktkommunikation", "energy", "bdew", "pydantic", "bpmn"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pydantic>=2.0",
    "PyYAML>=6.0",
]
dynamic = ["readme", "version"]

[project.urls]
Changelog = "https://github.com/Hochfrequenz/makoralle/releases"
Homepage = "https://github.com/Hochfrequenz/makoralle"

[dependency-groups]
tests = [
    "pytest==9.1.1",
    "lxml==6.1.2"  # BPMN output validation against the official BPMN 2.0 XSD
]
linting = [
    "ruff==0.16.4",
]
type_check = [
    "mypy==2.3.1",
    "types-PyYAML==6.0.12.20260518",
    "lxml-stubs==0.5.1",
    { include-group = "tests" }
]
spell_check = [
    "codespell==2.4.3"
]
coverage = [
    "coverage==7.15.4",
    { include-group = "tests" }
]
dev = [
    { include-group = "tests" },
    { include-group = "linting" },
    { include-group = "type_check" },
    { include-group = "coverage" },
    { include-group = "spell_check" },
    "pre-commit"
]

[tool.uv]
default-groups = []

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "N", "PL", "RUF"]
ignore = [
    "PLR0913", # too-many-arguments
    "PLR0917", # too-many-positional-arguments
    "PLR0912", # too-many-branches
    "PLR0915", # too-many-statements
    "PLR2004", # magic-value-comparison
    "RUF001",  # ambiguous-unicode-character-string
    "RUF002",  # ambiguous-unicode-character-docstring
    "RUF003",  # ambiguous-unicode-character-comment
]

[tool.ruff.lint.per-file-ignores]
"unittests/**" = ["PLR2004"]
"src/makoralle/__init__.py" = ["PLC0415"]
"src/makoralle/models/pid.py" = ["PLC2401"] # German domain field names carry ü/ä by design

[mypy]
truethy-bool = true

[tool.mypy]
disable_error_code = []

[build-system]
requires = ["hatchling>=1.29.0", "hatch-vcs", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"
fragments = [{ path = "README.md" }]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/_makoralle_version.py"
template = '''
version = "{version}"
'''

[tool.hatch.build.targets.sdist]
exclude = ["/unittests"]

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]
